<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeline Global - Con Carro Realista</title>
<style>
  body {
    background: #fff;
    margin: 0;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    position: relative;
  }
  img.timeline {
    height: 100vh;
    width: auto;
    display: inline-block;
  }

  .topbar {
    position: fixed;
    right: 12px;
    top: 12px;
    z-index: 20;
    background: rgba(255,255,255,0.9);
    padding: 6px 10px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    font-family: sans-serif;
  }
  a { color:#0077cc; text-decoration:none; font-weight:600; }

  /* 🚗 Carro */
  .car {
    position: fixed;
    bottom: 0px; /* un poco más abajo */
    left: -150px;
    width: 120px;
    z-index: 10;
    animation: zigzag 25s linear infinite;
    transform-origin: center;
  }

  @keyframes zigzag {
    0%   { left: -150px; transform: scaleX(1); }
    10%  { left: 30vw; transform: scaleX(1); }   /* avanza más */
    20%  { left: 50vw;  transform: scaleX(-1); }  /* retrocede más */
    30%  { left: 70vw; transform: scaleX(1); }   /* avanza más lejos */
    40%  { left: 12vw; transform: scaleX(-1); }  /* retrocede más largo */
    50%  { left: 45vw; transform: scaleX(1); }
    60%  { left: 25vw; transform: scaleX(-1); }
    70%  { left: 60vw; transform: scaleX(1); }
    80%  { left: 40vw; transform: scaleX(-1); }
    90%  { left: 75vw; transform: scaleX(1); }
    100% { left: 55vw; transform: scaleX(-1); }  /* termina retrocediendo */
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="colombia.html">Siguiente →</a>
  </div>

  <img class="timeline" src="Diseño sin título.png" alt="Timeline global de los videojuegos">

  <!-- 🚗 Imagen del carro -->
  <img class="car" src="carro.png" alt="Carrito animado">
</body>
</html>
