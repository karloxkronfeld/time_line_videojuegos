<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeline Global - Historia de los Videojuegos</title>
<style>
  body {
    background: #ffffff;
    margin: 0;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    position: relative;
  }
  img.timeline {
    height: 100vh;
    width: auto;
    display: inline-block;
  }

  /* Botón siguiente */
  .topbar {
    position: fixed;
    right: 12px;
    top: 12px;
    z-index: 20;
    background: rgba(255,255,255,0.9);
    padding: 6px 10px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    font-family: sans-serif;
  }
  a { color:#0077cc; text-decoration:none; font-weight:600; }

  /* 🚗 Animación del carro */
  .car {
    position: fixed;
    bottom: 40px;
    left: -150px; /* comienza fuera de la pantalla */
    width: 120px;
    animation: drive 25s linear infinite;
    z-index: 10;
  }

  /* Recorrido del carro */
  @keyframes drive {
    0% { left: -150px; }
    100% { left: 100vw; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="colombia.html">Siguiente →</a>
  </div>

  <!-- Tu imagen principal -->
  <img class="timeline" src="Diseño sin título.png" alt="Timeline global de los videojuegos">

  <!-- 🚗 Imagen del carro -->
  <img class="car" src="carro.png" alt="Carrito">
</body>
</html>
