<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeline Global - Carros en movimiento continuo</title>
<style>
  body {
    background: #fff;
    margin: 0;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    position: relative;
  }

  img.timeline {
    height: 100vh;
    width: auto;
    display: inline-block;
  }

  .topbar {
    position: fixed;
    right: 12px;
    top: 12px;
    z-index: 20;
    background: rgba(255,255,255,0.9);
    padding: 6px 10px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    font-family: sans-serif;
  }

  a { color:#0077cc; text-decoration:none; font-weight:600; }

  /* 🚗 Estilos base para todos los vehículos */
  .car {
    position: fixed;
    bottom: -20px; /* más abajo */
    width: 100px;
    transform: scaleX(1);
    z-index: 10;
  }

  /* Animación de avance infinito */
  @keyframes drive {
    0% { left: -150px; }
    100% { left: 110vw; } /* atraviesa la pantalla */
  }

  /* Varias velocidades */
  .car1 {
    animation: drive 18s linear infinite;
  }
  .car2 {
    animation: drive 25s linear infinite;
    bottom: -10px;
    width: 120px;
    opacity: 0.9;
  }
  .car3 {
    animation: drive 35s linear infinite;
    bottom: -30px;
    width: 80px;
    opacity: 0.8;
  }

  /* Pequeña variación de inicio (para que no salgan juntos) */
  .car1 { animation-delay: 0s; }
  .car2 { animation-delay: 5s; }
  .car3 { animation-delay: 10s; }

  /* Carretera opcional */
  .road {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: linear-gradient(to bottom, #666 0%, #333 100%);
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="colombia.html">Siguiente →</a>
  </div>

  <img class="timeline" src="Diseño sin título.png" alt="Timeline global de los videojuegos">

  <!-- 🚧 carretera -->
  <div class="road"></div>

  <!-- 🚗 vehículos -->
  <img class="car car1" src="carro.png" alt="carro 1">
  <img class="car car2" src="carro.png" alt="carro 2">
  <img class="car car3" src="carro.png" alt="carro 3">
</body>
</html>
